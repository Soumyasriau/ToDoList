<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0517"/>
      <stop offset="0.5" stop-color="#1c0c3a"/>
      <stop offset="1" stop-color="#3b1480"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e9d5ff" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>

  <g filter="url(#blur)">
    <ellipse cx="250" cy="170" rx="360" ry="240" fill="#9333ea" opacity="0.65"/>
    <ellipse cx="1400" cy="200" rx="330" ry="220" fill="#d946ef" opacity="0.45"/>
    <ellipse cx="1250" cy="800" rx="420" ry="250" fill="#7c3aed" opacity="0.6"/>
    <ellipse cx="300" cy="800" rx="300" ry="180" fill="#c026d3" opacity="0.35"/>
  </g>

  <rect width="1600" height="900" fill="url(#dots)"/>

  <path d="M0 720 C250 650 450 790 750 730 C1050 670 1300 790 1600 700 L1600 900 L0 900 Z" fill="url(#wave1)"/>
  <path d="M0 790 C300 740 520 850 820 800 C1120 750 1350 850 1600 780 L1600 900 L0 900 Z" fill="url(#wave2)"/>

  <g fill="none" stroke="#e9d5ff" opacity="0.14">
    <circle cx="1450" cy="130" r="170" stroke-width="2"/>
    <circle cx="1450" cy="130" r="120" stroke-width="2"/>
    <circle cx="140" cy="640" r="200" stroke-width="2"/>
    <circle cx="140" cy="640" r="140" stroke-width="2"/>
  </g>

  <g transform="translate(70 120) rotate(-6 190 160)" filter="url(#shadow)">
    <rect width="380" height="330" rx="28" fill="url(#card)" stroke="#e9d5ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="30" y="28" width="150" height="16" rx="8" fill="#f3e8ff" opacity="0.7"/>
    <g>
      <circle cx="58" cy="105" r="19" fill="url(#badge)"/>
      <path d="M49 105 l7 7 l13 -15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="92" y="98" width="200" height="14" rx="7" fill="#f3e8ff" opacity="0.55"/>
      <line x1="92" y1="105" x2="292" y2="105" stroke="#fff" stroke-width="2" opacity="0.5"/>
    </g>
    <g>
      <circle cx="58" cy="170" r="19" fill="url(#badge)"/>
      <path d="M49 170 l7 7 l13 -15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="92" y="163" width="160" height="14" rx="7" fill="#f3e8ff" opacity="0.55"/>
      <line x1="92" y1="170" x2="252" y2="170" stroke="#fff" stroke-width="2" opacity="0.5"/>
    </g>
    <g>
      <circle cx="58" cy="235" r="19" fill="none" stroke="#e9d5ff" stroke-width="3" opacity="0.8"/>
      <rect x="92" y="228" width="220" height="14" rx="7" fill="#f3e8ff" opacity="0.7"/>
    </g>
    <g>
      <circle cx="58" cy="290" r="19" fill="none" stroke="#e9d5ff" stroke-width="3" opacity="0.6"/>
      <rect x="92" y="283" width="130" height="14" rx="7" fill="#f3e8ff" opacity="0.5"/>
    </g>
  </g>

  <g transform="translate(1290 520)" filter="url(#shadow)">
    <circle r="92" fill="url(#badge)"/>
    <circle r="92" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="120" fill="none" stroke="#e9d5ff" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M-38 2 l28 28 l52 -60" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(1160 270) rotate(5)">
      <rect width="300" height="72" rx="20" fill="url(#card)" stroke="#e9d5ff" stroke-opacity="0.3"/>
      <circle cx="38" cy="36" r="15" fill="url(#badge)"/>
      <path d="M31 36 l5 5 l10 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="68" y="29" width="150" height="14" rx="7" fill="#f3e8ff" opacity="0.55"/>
    </g>
    <g transform="translate(1210 360) rotate(5)">
      <rect width="260" height="72" rx="20" fill="url(#card)" stroke="#e9d5ff" stroke-opacity="0.3"/>
      <circle cx="38" cy="36" r="15" fill="none" stroke="#e9d5ff" stroke-width="3"/>
      <rect x="68" y="29" width="120" height="14" rx="7" fill="#f3e8ff" opacity="0.55"/>
    </g>
  </g>

  <g transform="translate(110 600) rotate(4)" filter="url(#shadow)">
    <rect width="230" height="150" rx="22" fill="url(#card)" stroke="#e9d5ff" stroke-opacity="0.3"/>
    <rect width="230" height="42" rx="22" fill="#a855f7" opacity="0.55"/>
    <rect y="22" width="230" height="20" fill="#a855f7" opacity="0.55"/>
    <g fill="#f3e8ff" opacity="0.6">
      <circle cx="40" cy="80" r="6"/><circle cx="80" cy="80" r="6"/><circle cx="120" cy="80" r="6"/><circle cx="160" cy="80" r="6"/><circle cx="200" cy="80" r="6"/>
      <circle cx="40" cy="112" r="6"/><circle cx="80" cy="112" r="6"/><circle cx="120" cy="112" r="6"/>
    </g>
    <circle cx="160" cy="112" r="11" fill="#e879f9"/>
  </g>

  <g fill="#f5e8ff" filter="url(#soft)" opacity="0.9">
    <circle cx="650" cy="90" r="4"/><circle cx="960" cy="170" r="3"/>
    <circle cx="560" cy="820" r="3"/><circle cx="1010" cy="630" r="4"/>
    <circle cx="520" cy="300" r="3"/><circle cx="760" cy="860" r="3"/>
  </g>
  <g fill="#fff" opacity="0.85">
    <path d="M880 80 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 z"/>
    <path d="M520 560 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4 z"/>
    <path d="M1060 760 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4 z"/>
  </g>
</svg>
